<div class="job-log-toolbar" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px;">
  <button type="button" class="btn" id="btnCopyJobLog" disabled>复制日志</button>
  <button type="button" class="btn" id="btnDownloadJobLog" disabled>下载日志</button>
  <label style="display:flex;align-items:center;gap:6px;width:auto;margin:0;white-space:nowrap;"><input type="checkbox" id="jobLogFollow" style="width:16px;height:16px;min-height:0;margin:0;padding:0;flex:none;" checked>跟随最新日志</label>
  <span id="jobLogStatus" role="status" style="font-size:12px;">加载中…</span>
</div>
