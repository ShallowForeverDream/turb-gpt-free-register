<dialog id="accountImportDialog" class="workspace-dialog" aria-labelledby="accountImportTitle">
  <header><h2 id="accountImportTitle">导入 GPT 账号</h2><button type="button" data-close-dialog="accountImportDialog" aria-label="关闭">×</button></header>
  <p>勾选本次数据包含的字段。无表头时按下方顺序排列；带表头时按列名匹配。重复邮箱跳过，不覆盖已有账号。</p>
  <div id="accountImportFields" class="workspace-fields"></div>
  <p id="accountImportOrder" aria-live="polite"></p>
  <label>粘贴文本（制表符、CSV、Markdown 表格或 ---- 分隔）
    <textarea id="registeredImportText" spellcheck="false" autocomplete="off" placeholder="user@example.com"></textarea>
  </label>
  <button type="button" class="btn jobs-tb-btn" id="btnImportRegistered">导入粘贴内容</button>
  <label style="display:block;margin-top:18px">或选择文件（.xlsx / .txt / .csv / .tsv，最大 8 MB）
    <input id="registeredImportFile" type="file" accept=".xlsx,.txt,.csv,.tsv">
  </label>
  <button type="button" class="btn jobs-tb-btn" id="btnImportRegisteredFile">导入文件</button>
  <span id="registeredImportResult" role="status"></span>
</dialog>
<dialog id="accountExportDialog" class="workspace-dialog" aria-labelledby="accountExportTitle">
  <header><h2 id="accountExportTitle">导出 TXT</h2><button type="button" data-close-dialog="accountExportDialog" aria-label="关闭">×</button></header>
  <p id="accountExportCount"></p>
  <div id="accountExportFields" class="workspace-fields"></div>
  <p>仅导出勾选字段，使用带表头的制表符文本。密码、Token 和 2FA 密钥属于敏感信息，请妥善保存文件。</p>
  <span id="accountExportResult" role="status"></span>
  <footer><button type="button" class="btn jobs-tb-btn" id="downloadAccountFields">下载 TXT</button></footer>
</dialog>
