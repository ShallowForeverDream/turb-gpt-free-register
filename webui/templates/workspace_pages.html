<div id="tab-github" class="hidden">
  <section class="workspace-placeholder"><h1>github账号</h1><p>接下来开发。此页面暂不读取、导入或创建 GitHub 账号。</p></section>
</div>
<template id="workspaceLogTemplate">
  <section class="workspace-history">
    <header><h1>日志</h1><span id="workspaceLogSummary" class="muted" aria-live="polite">加载中…</span><button type="button" class="btn jobs-tb-btn" id="refreshLogHistory">刷新</button></header>
    <form id="workspaceLogFilters" class="history-filters">
      <input name="q" type="search" placeholder="邮箱 / 任务 ID" aria-label="邮箱或任务ID">
      <label>状态 <select name="status"><option value="">全部</option><option value="running">运行中</option><option value="pending">排队</option><option value="success">成功</option><option value="failed">失败（含网络/收码异常）</option><option value="partial_success">部分成功</option><option value="blocked">受阻</option><option value="stopped">停止</option><option value="cancelled">取消</option><option value="disabled">停用</option><option value="already_registered">已注册</option></select></label>
      <label>创建日期 <input name="date_from" type="date" aria-label="创建起始日期"> 至 <input name="date_to" type="date" aria-label="创建结束日期"></label>
      <button class="btn jobs-tb-btn" type="submit">筛选</button><button class="btn jobs-tb-btn" type="reset">清除筛选</button>
    </form>
    <div class="table-wrap">
      <table class="history-table"><colgroup><col style="width:48px"><col style="width:85px"><col style="width:190px"><col style="width:130px"><col style="width:130px"><col style="width:145px"><col style="width:250px"><col style="width:95px"></colgroup>
        <thead><tr><th>ID</th><th>状态</th><th>邮箱</th><th>开始</th><th>完成</th><th>总 / 动态IP</th><th>状态说明</th><th>进度</th></tr></thead>
        <tbody id="workspaceLogRows"></tbody>
      </table>
    </div>
    <div class="history-pager"><span id="workspaceLogPage"></span><button type="button" class="btn jobs-tb-btn" id="previousLogHistory">上一页</button><button type="button" class="btn jobs-tb-btn" id="nextLogHistory">下一页</button></div>
  </section>
</template>
<dialog id="workspaceProgressDialog" class="workspace-dialog workspace-progress-dialog" aria-labelledby="workspaceProgressTitle">
  <header><h2 id="workspaceProgressTitle">注册进度</h2><button type="button" id="workspaceProgressClose" aria-label="关闭">×</button></header>
  <div id="workspaceProgressSummary" class="workspace-progress-summary" role="status">加载中…</div>
  <div id="workspaceProgressSteps" class="workspace-progress-groups" aria-label="注册、2FA、Codex 授权步骤"></div>
  <p id="workspaceProgressNote" class="workspace-progress-note"></p>
  <footer><button type="button" id="workspaceProgressRawLog" class="btn jobs-tb-btn">查看原始日志</button><button type="button" id="workspaceProgressDone" class="btn jobs-tb-btn">关闭</button></footer>
</dialog>
